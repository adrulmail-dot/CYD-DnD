; PlatformIO project for the "Cheap Yellow Display" ESP32-2432S028
; D&D Bestiary & Spell Tracker
;
; Board notes:
;  - MCU: ESP32-WROOM-32 (classic Xtensa LX6), 4MB flash, no PSRAM on most units.
;  - Display: ILI9341 320x240 TFT via SPI (see include/User_Setup.h)
;  - Touch: XPT2046 resistive touch controller, shares the TFT SPI bus.
;  - microSD card slot on a separate SPI bus.
;  - Some newer "2 USB" revisions add a second USB-C connector purely for
;    power/programming convenience; the MCU and pinout are unchanged, so this
;    configuration applies to those boards as well. If your unit uses an
;    ESP32-S3 and/or a capacitive (CST820/GT911, I2C) touch panel instead of
;    resistive XPT2046, see the "S3 / capacitive touch" note in README.md.

[env:cyd-esp32-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

build_flags =
    -D USER_SETUP_LOADED=1
    -I include
    -include include/User_Setup.h
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^6.21.5
    bodmer/TJpg_Decoder@^1.1.0
